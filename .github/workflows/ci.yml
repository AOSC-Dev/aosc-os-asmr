name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: asmr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Validate JSON Schema documents
        run: |
          set -euo pipefail
          for schema in schemas/*.json; do
            python3 -m json.tool "$schema" >/dev/null
          done

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Validate examples
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/asmr.py check --root examples

      - name: Check out the AOSC stable package recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AOSC-Dev/aosc-os-abbs
          ref: stable
          path: .abbs-input
          persist-credentials: false

      - name: Build catalog from ABBS and editorial metadata
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/asmr.py build \
            --abbs-tree .abbs-input \
            --output "${RUNNER_TEMP}/asmr-dist/v1" \
            --source-commit "${GITHUB_SHA}"

      - name: Build examples
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/asmr.py build \
            --root examples \
            --output "${RUNNER_TEMP}/asmr-examples/v1" \
            --source-commit "${GITHUB_SHA}"

      - name: Check homepage artifacts before upload
        run: |
          for catalog in "${RUNNER_TEMP}/asmr-dist/v1" "${RUNNER_TEMP}/asmr-examples/v1"; do
            test -s "$catalog/homepage.json"
          done

      - name: Upload generated catalogs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: asmr-catalog-${{ github.sha }}
          path: |
            ${{ runner.temp }}/asmr-dist
            ${{ runner.temp }}/asmr-examples
          if-no-files-found: error
          retention-days: 14

      - name: Write the Pages entry point
        run: |
          echo '<!doctype html><html lang="en"><meta charset="utf-8"><title>ASMR dev catalog</title><a href="v1/index.json">ASMR dev catalog index</a></html>' > "${RUNNER_TEMP}/asmr-dist/index.html"

      - name: Upload the dev catalog for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/asmr-dist

  publish-dev:
    name: Publish dev catalog to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dev catalog
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
