name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: asmr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Validate JSON Schema documents
        run: |
          set -euo pipefail
          for schema in schemas/*.json; do
            python3 -m json.tool "$schema" >/dev/null
          done

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Validate examples
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/asmr.py check --root examples

      - name: Check out the AOSC stable package recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AOSC-Dev/aosc-os-abbs
          ref: stable
          path: .abbs-input
          persist-credentials: false

      - name: Build catalog from ABBS and editorial metadata
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/asmr.py build \
            --abbs-tree .abbs-input \
            --output "${RUNNER_TEMP}/asmr-dist/v1" \
            --source-commit "${GITHUB_SHA}"

      - name: Build examples
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/asmr.py build \
            --root examples \
            --output "${RUNNER_TEMP}/asmr-examples/v1" \
            --source-commit "${GITHUB_SHA}"

      - name: Check homepage artifacts before upload
        run: |
          for catalog in "${RUNNER_TEMP}/asmr-dist/v1" "${RUNNER_TEMP}/asmr-examples/v1"; do
            test -s "$catalog/homepage.json"
          done

      - name: Upload generated catalogs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: asmr-catalog-${{ github.sha }}
          path: |
            ${{ runner.temp }}/asmr-dist
            ${{ runner.temp }}/asmr-examples
          if-no-files-found: error
          retention-days: 14
