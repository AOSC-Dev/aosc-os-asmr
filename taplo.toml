[formatting]
align_entries = false
array_auto_expand = true
column_width = 100
reorder_keys = false

[[rule]]
include = ["manual/repository.toml", "examples/manual/repository.toml"]

[rule.schema]
path = "schemas/repository.schema.json"

[[rule]]
include = ["manual/apps/**/app.toml", "examples/manual/apps/**/app.toml"]

[rule.schema]
path = "schemas/app.schema.json"

[[rule]]
include = ["manual/collections/*.toml", "examples/manual/collections/*.toml"]

[rule.schema]
path = "schemas/collection.schema.json"

[[rule]]
include = ["manual/taxonomy/categories.toml", "examples/manual/taxonomy/categories.toml"]

[rule.schema]
path = "schemas/taxonomy.schema.json"
