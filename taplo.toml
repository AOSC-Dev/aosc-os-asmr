[formatting]
align_entries = false
array_auto_expand = true
column_width = 100
reorder_keys = false

[[rule]]
include = ["repository.toml", "examples/repository.toml"]

[rule.schema]
path = "schemas/repository.schema.json"

[[rule]]
include = ["apps/**/app.toml", "examples/apps/**/app.toml"]

[rule.schema]
path = "schemas/app.schema.json"

[[rule]]
include = ["collections/*.toml", "examples/collections/*.toml"]

[rule.schema]
path = "schemas/collection.schema.json"

[[rule]]
include = ["taxonomy/categories.toml", "examples/taxonomy/categories.toml"]

[rule.schema]
path = "schemas/taxonomy.schema.json"
